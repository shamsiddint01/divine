# Divine.uz — umumiy demo sayt (bepul sinab ko'rish, 2026-11-10): docs/RUNBOOK-RENDER.md "Demo sayt".
# Asosiy render.yaml'dan alohida Blueprint: New → Blueprint → Blueprint Path: render-demo.yaml.
# Kod o'sha; farqi — DEMO_MODE (sinov hisoblari 7 kun / 1 soat, foydalanuvchi boshqaruvi yopiq), baza `divine_demo`.
services:
  - type: web
    name: divine-uz-demo-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: scripts/render/build-api.sh
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: TRUST_PROXY
        value: loopback,uniquelocal,cloudflare,render
      - key: CORS_ORIGINS
        value: https://divine-uz-demo-web.onrender.com
      - key: DEMO_MODE
        value: 'true'
      # .env.render.demo.secrets (scripts/render/setup-demo.sh).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: PASSWORD_PEPPER
        sync: false

  - type: web
    name: divine-uz-demo-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: scripts/render/build-web.sh
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_MODE
        value: http
      - key: VITE_API_BASE_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://divine-uz-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
