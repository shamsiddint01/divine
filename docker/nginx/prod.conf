# Divine.uz — production Nginx (Phase 17): TLS terminator + SPA + API reverse proxy (bir origin).
# docker-compose.prod.yml uni web image'dagi default.conf o'rniga (read-only) ulaydi.
# Sertifikat va kalit — Docker secrets (/run/secrets/tls_cert, /run/secrets/tls_key).

# HTTP: faqat HTTPS'ga yo'naltirish (HSTS yo'q — u faqat TLS orqali beriladi) va konteyner healthcheck'i.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    # Mozilla "intermediate": TLS 1.2 + 1.3, faqat AEAD shifrlar, forward secrecy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → NestJS (ichki tarmoq). Bitta proxy hop: TRUST_PROXY=1. Mijoz yuborgan X-Forwarded-For
    # zanjiri qabul qilinmaydi — faqat haqiqiy ulanish manzili (rate limit va audit IP'si soxtalashmasin).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        # API javoblaridagi o'z header'lari (helmet, HSTS, no-store) saqlanadi.
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers-tls.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers-tls.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
