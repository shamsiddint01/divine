# Faqat HTTPS server blokida (prod.conf). HSTS — TLS to'g'ri ishlagandan keyingina (SECURITY §12, Phase 17).
# `preload` qo'shilmagan: domen egasi HSTS preload ro'yxatiga yozilishga alohida qaror qiladi.
include /etc/nginx/snippets/security-headers.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
